# =============================================================================
# Observal Helm values
# =============================================================================

global:
  imageRegistry: ""
  imagePullSecrets: []

api:
  image:
    repository: ghcr.io/observal/observal-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  workers: 2
  resources:
    limits:
      memory: 1536Mi
    requests:
      memory: 256Mi
      cpu: 100m

worker:
  image:
    repository: ghcr.io/observal/observal-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      memory: 1536Mi
    requests:
      memory: 256Mi
      cpu: 50m

web:
  image:
    repository: ghcr.io/observal/observal-web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      memory: 64Mi
      cpu: 50m

postgresql:
  enabled: true
  externalUrl: ""
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 256Mi
      cpu: 100m
  storage:
    size: 10Gi
    storageClassName: ""

clickhouse:
  enabled: true
  externalUrl: ""
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 512Mi
      cpu: 250m
  storage:
    size: 50Gi
    storageClassName: ""

redis:
  enabled: true
  externalUrl: ""
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 128Mi
      cpu: 50m
  maxmemory: "400mb"
  storage:
    size: 2Gi
    storageClassName: ""

ingress:
  enabled: true
  className: nginx
  host: observal.example.com
  tls:
    enabled: false
    secretName: ""
    certManager:
      enabled: false
      issuerName: letsencrypt-prod
      issuerKind: ClusterIssuer
  annotations: {}

secrets:
  # Use a pre-existing Secret instead of creating one. Secret must contain all
  # keys: SECRET_KEY, POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, DATABASE_URL,
  # CLICKHOUSE_URL, REDIS_URL
  existingSecret: ""
  secretKey: ""
  postgresPassword: ""
  clickhousePassword: ""

config:
  logLevel: INFO
  logFormat: json
  jwtSigningAlgorithm: ES256
  jwtKeyDir: /data/keys
  seedDemoAccounts: false

apidata:
  storage:
    size: 5Gi
    storageClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# PodDisruptionBudgets limit voluntary evictions (node drains, cluster
# upgrades). With the default of one replica and minAvailable: 1, a drain
# waits until another replica is available, so raise api.replicas and
# worker.replicas or lower minAvailable before draining nodes.
podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 1

# NetworkPolicies for the API and worker pods. Opt-in, and only enforced when
# the cluster CNI supports NetworkPolicy (e.g. Calico, Cilium).
networkPolicy:
  enabled: false
  # Pods of the ingress controller allowed to reach the API on port 8000.
  # Defaults match the upstream ingress-nginx chart. Set both selectors to null
  # to allow only the in-release web pods and api.extraIngress.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
  # Cluster DNS reachable from the worker on port 53 (UDP and TCP). Set both
  # selectors to null to allow port 53 to any destination (e.g. NodeLocal DNSCache).
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Required when enabled: Kubernetes API endpoint CIDRs, allowed on TCP 443 and
  # 6443 for the worker's wait-for-init initContainer. List the endpoint
  # addresses, then add each IPv4 address as /32 and each IPv6 address as /128:
  #   kubectl get endpointslices -n default \
  #     -l kubernetes.io/service-name=kubernetes \
  #     -o jsonpath='{range .items[*].endpoints[*].addresses[*]}{.}{"\n"}{end}'
  kubeApiServer:
    cidrs: []
  api:
    # Additional NetworkPolicyIngressRule entries for API pods, e.g. a
    # Prometheus scraper or a load balancer that targets pod IPs directly.
    extraIngress: []
  worker:
    # Additional NetworkPolicyEgressRule entries for worker pods. Needed for
    # external PostgreSQL/ClickHouse/Redis, Git source sync, alert webhooks,
    # insight LLM providers, and usage reporting.
    extraEgress: []
