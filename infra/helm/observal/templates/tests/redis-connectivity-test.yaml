apiVersion: v1
kind: Pod
metadata:
  name: {{ include "observal.fullname" . }}-redis-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observal.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,after-hook-success
spec:
  serviceAccountName: {{ include "observal.serviceAccountName" . }}
  containers:
  - name: redis-test
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        echo "Testing Redis connectivity..."
        max_retries=20
        retry_delay=1

        for i in $(seq 1 $max_retries); do
          if redis-cli -h {{ include "observal.fullname" . }}-redis ping | grep -q "PONG"; then
            echo "✓ Redis is healthy"
            exit 0
          fi
          echo "Attempt $i/$max_retries failed, retrying in ${retry_delay}s..."
          sleep $retry_delay
        done
        echo "✗ Redis failed to become healthy"
        exit 1
  restartPolicy: Never
