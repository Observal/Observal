{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "observal.fullname" . }}-clickhouse-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observal.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,after-hook-success
spec:
  serviceAccountName: {{ include "observal.serviceAccountName" . }}
  containers:
  - name: clickhouse-test
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - |
        echo "Testing ClickHouse connectivity..."
        max_retries=30
        retry_delay=2

        for i in $(seq 1 $max_retries); do
          if curl -f http://{{ include "observal.fullname" . }}-clickhouse:8123/ping; then
            echo "✓ ClickHouse is healthy"
            exit 0
          fi
          echo "Attempt $i/$max_retries failed, retrying in ${retry_delay}s..."
          sleep $retry_delay
        done
        echo "✗ ClickHouse failed to become healthy"
        exit 1
  restartPolicy: Never
{{- end }}
